<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSync Logistics - Intelligent Logistics Solutions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>EcoSync Logistics</h1>
            <div class="agent-selector">
                <label for="agent-select">Active Agent:</label>
                <select id="agent-select">
                    {% for agent in agents %}
                    <option value="{{ agent }}">{{ agent }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message system">
                <div class="message-content">
                    <p>Welcome to EcoSync Logistics! Our intelligent system helps you with:</p>
                    <p>• Weather forecasts and demand predictions</p>
                    <p>• Optimized route planning and traffic updates</p>
                    <p>Use the form below to quickly get routing or forecasting information.</p>
                </div>
            </div>
        </div>
        
        <!-- Logistics Form Section -->
        <div class="logistics-form" id="logistics-form">
            <h3 class="logistics-form-title">
                <i class="fas fa-truck"></i> Logistics Request Form
            </h3>
            <div class="form-fields">
                <div class="form-group">
                    <label for="from-location">From:</label>
                    <input type="text" id="from-location" placeholder="Origin city (e.g., Lahore)">
                </div>
                <div class="form-group">
                    <label for="to-location">To:</label>
                    <input type="text" id="to-location" placeholder="Destination city (e.g., Karachi)">
                </div>
                <div class="form-group">
                    <label for="goods-type">Kind of Goods:</label>
                    <select id="goods-type">
                        <option value="">Select goods type...</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Food">Food</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Medicine">Medicine</option>
                        <option value="Weather Equipment">Weather Equipment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="delivery-date">Delivery Date:</label>
                    <input type="date" id="delivery-date">
                </div>
            </div>
            <button type="button" id="submit-logistics">
                <i class="fas fa-search"></i> Get Logistics Information
            </button>
        </div>
        
        <div class="chat-input">
            <form id="chat-form" class="chat-form">
                <textarea id="user-message" class="message-textarea" placeholder="Type your message here or use the form above..." rows="1"></textarea>
                <div class="input-actions">
                    <button type="button" class="action-button" id="clear-chat" title="Clear conversation">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <button type="submit">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
